name: Wine ML AWS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wine-aws-${{ github.ref }}
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: wine-ml-api
  ECS_CLUSTER: default
  ECS_SERVICE: wine-quality-api
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      # 1. Descargar codigo
      - uses: actions/checkout@v6
      # 2. Preparar Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # 3. Instalar dependencias, entrenar el modelo y ejecutar tests
      - name: Train and test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m scripts.train
          python -m pytest -q
      # 4. Construir la imagen Docker para Linux
      - name: Build image
        run: docker build --platform linux/amd64 -t wine-ml-api:ci .
      # El despliegue solo se habilita en main (push o ejecucion manual)
      # y si ENABLE_AWS_DEPLOY esta configurada como true.
      - name: Decide deployment
        id: gate
        env:
          ENABLED: ${{ vars.ENABLE_AWS_DEPLOY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && \
                "$GITHUB_REF" == "refs/heads/main" && \
                "$ENABLED" == "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      # 5. Autenticacion en AWS mediante OIDC (sin claves de larga duracion)
      - name: AWS OIDC login
        if: steps.gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: wine-github-actions
      # 6. Publicar la imagen en ECR y actualizar el servicio ECS
      - name: Push and deploy
        if: steps.gate.outputs.deploy == 'true'
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          SERVICE_ARN: ${{ vars.ECS_SERVICE_ARN }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          aws --version
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          TAG="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"
          docker tag wine-ml-api:ci "$IMAGE"
          docker push "$IMAGE"
          # Usar el digest inmutable de ECR para desplegar exactamente esta imagen.
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          export IMAGE_REF="$REGISTRY/$ECR_REPOSITORY@$DIGEST"
          python - <<'PY'
          import json, os
          data = {
              "serviceArn": os.environ["SERVICE_ARN"],
              "primaryContainer": {
                  "image": os.environ["IMAGE_REF"],
                  "containerPort": 8000
              },
              "healthCheckPath": "/health"
          }
          with open("update.json", "w") as f:
              json.dump(data, f)
          PY
          aws ecs update-express-gateway-service \
            --cli-input-json file://update.json
          # Esperar a que ECS estabilice el servicio y verificar imagen y endpoints.
          sleep 15
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
          TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          ACTIVE=$(aws ecs describe-task-definition --task-definition "$TD" \
            --query "taskDefinition.containerDefinitions[?name=='Main'].image | [0]" \
            --output text)
          test "$ACTIVE" = "$IMAGE_REF"
          python -m scripts.smoke_test --base-url "$APP_URL"
          python - <<'PY'
          import json, os, urllib.request
          local = json.load(open("artifacts/metadata.json"))
          url = os.environ["APP_URL"].rstrip("/") + "/model-info"
          with urllib.request.urlopen(url, timeout=30) as response:
              remote = json.load(response)
          assert local["model_version"] == remote["model_version"]
          print("Modelo verificado:", remote["model_version"])
          PY
          echo "Imagen desplegada: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
